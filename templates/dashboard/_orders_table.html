<div class="tw"><table class="tbl">
  <tr><th>#</th><th>Customer</th><th>Total</th><th>Payment</th><th>Status</th><th>Date</th></tr>
  {% for o in orders %}
  <tr>
    <td><a href="{% url 'dashboard:order_detail' o.pk %}">#{{ o.pk }}</a></td>
    <td>{{ o.full_name }}<br><small>{{ o.phone }}</small></td>
    <td>৳{{ o.total }}</td>
    <td>{{ o.get_payment_method_display }}<br><span class="badge {% if o.payment_status == 'paid' %}ok{% endif %}">{{ o.get_payment_status_display }}</span></td>
    <td><span class="badge">{{ o.get_status_display }}</span></td>
    <td>{{ o.created_at|date:"d M, H:i" }}</td>
  </tr>
  {% empty %}<tr><td colspan="6" class="muted">No orders.</td></tr>{% endfor %}
</table></div>
